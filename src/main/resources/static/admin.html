<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | Home Sweet Home Care</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="/">Home</a>
        <a href="/scheduling.html">Scheduling</a>
        <a href="/services.html">Services</a>
        <a href="/faq.html">FAQ</a>
        <a href="/admin.html">Admin</a>
      </nav>
    </header>
    <main>
      <section class="card">
        <h1>Admin Contact Submissions</h1>
        <p>Enter the admin API key to view submitted contact requests.</p>

        <form id="admin-form">
          <label for="adminKey">Admin API Key</label>
          <input id="adminKey" name="adminKey" type="password" required />
          <button type="submit">Load Requests</button>
          <p id="admin-status" class="status" aria-live="polite"></p>
        </form>

        <table id="results-table" hidden>
          <thead>
            <tr>
              <th>Submitted</th>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Message</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </main>

    <script>
      const adminForm = document.getElementById("admin-form");
      const adminStatus = document.getElementById("admin-status");
      const resultsTable = document.getElementById("results-table");
      const tableBody = resultsTable.querySelector("tbody");

      adminForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        adminStatus.textContent = "Loading...";
        adminStatus.className = "status";
        tableBody.innerHTML = "";
        resultsTable.hidden = true;

        try {
          const response = await fetch("/api/admin/collected-data", {
            headers: {
              "X-Admin-Key": adminForm.adminKey.value,
            },
          });

          if (!response.ok) {
            throw new Error(response.status === 401 ? "Invalid admin key." : "Unable to load data.");
          }

          const rows = await response.json();
          rows.forEach((row) => {
            const tr = document.createElement("tr");
            const cells = [
              row.submittedAt ?? "",
              row.fullName ?? "",
              row.email ?? "",
              row.phone ?? "",
              row.message ?? "",
            ];
            cells.forEach((value) => {
              const td = document.createElement("td");
              td.textContent = value;
              tr.appendChild(td);
            });
            tableBody.appendChild(tr);
          });

          resultsTable.hidden = false;
          adminStatus.textContent = `Loaded ${rows.length} request(s).`;
          adminStatus.className = "status success";
        } catch (error) {
          adminStatus.textContent = error.message || "Unable to load data.";
          adminStatus.className = "status error";
        }
      });
    </script>
  </body>
</html>
