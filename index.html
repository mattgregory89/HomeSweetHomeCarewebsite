<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Sweet Home Care</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f7f9fb;
        color: #1d2a35;
      }

      main {
        max-width: 540px;
        margin: 48px auto;
        padding: 24px;
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin-top: 0;
      }

      p {
        margin-bottom: 20px;
      }

      form {
        display: grid;
        gap: 12px;
      }

      label {
        font-weight: 600;
      }

      input,
      textarea,
      button {
        font: inherit;
        padding: 10px;
        border: 1px solid #ccd3db;
        border-radius: 6px;
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      button {
        background: #1f6fb2;
        color: #ffffff;
        border: none;
        cursor: pointer;
      }

      button:hover {
        background: #17588d;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Home Sweet Home Care</h1>
      <p>Please share your details and we will contact you shortly.</p>

      <form>
        <label for="name">Name</label>
        <input id="name" name="name" type="text" required />

        <label for="phone">Phone Number</label>
        <input id="phone" name="phone" type="tel" required />

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />

        <label for="message">Message</label>
        <textarea id="message" name="message" maxlength="1000" required></textarea>

        <button type="submit">Send Message</button>
      </form>
    </main>
  </body>
</html>
